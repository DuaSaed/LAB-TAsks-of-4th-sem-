<!DOCTYPE html>
<html>
<head>
    <title>Chatbot</title>
    <style>
        body {
            background-color: #1e1e2f;
            color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px;
        }
        h2 {
            text-align: center;
            color: #00adb5;
        }
        #chat-box {
            width: 100%;
            height: 400px;
            overflow-y: auto;
            border: 2px solid #393e46;
            background-color: #222831;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        #chat-box p {
            margin: 10px 0;
        }
        input[type="text"] {
            width: 70%;
            padding: 12px;
            border-radius: 5px;
            border: none;
            outline: none;
            background-color: #393e46;
            color: #f5f5f5;
        }
        button {
            padding: 12px 25px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover {
            background-color: #019ca1;
        }
        form {
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h2>Talk to our Mental Health Bot</h2>
    <div id="chat-box"></div>
    <form id="chat-form">
        <input type="text" id="user-input" placeholder="Type your message..." required>
        <button type="submit">Send</button>
        <button type="button" id="done-button">I'm Done</button> <!-- "I'm done" button -->
    </form>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const doneButton = document.getElementById('done-button'); // "I'm done" button

        // Handle chat message submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userText = input.value;
            chatBox.innerHTML += `<p><strong>You:</strong> ${userText}</p>`;
            input.value = '';

            const res = await fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `user_input=${encodeURIComponent(userText)}`
            });

            const data = await res.json();
            chatBox.innerHTML += `<p><strong>Bot:</strong> ${data.response}</p>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // Handle "I'm done" button click
        doneButton.addEventListener('click', () => {
            window.location.href = '/success'; // Redirect to success page
        });
    </script>
</body>
</html>
