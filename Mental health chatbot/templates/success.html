<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success</title>
    <style>
        body {
            background-color: #222831;
            color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #00adb5;
            font-size: 36px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #f5f5f5;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }

        .container {
            background-color: #393e46;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        .button {
            background-color: #00adb5;
            padding: 12px 30px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-radius: 5px;
            margin-top: 30px;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #019ca1;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            color: #f5f5f5;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thank you, {{ patient_data['name'] }}!</h1>
        <p>Your information has been saved successfully. We appreciate your effort in sharing your responses with us. Your mental health journey is important to us, and we are here to support you.</p>
        <a href="/" class="button">Back to Home</a>
    </div>

    <div class="footer">
        <p>.</p>
    </div>
</body>
</html>
