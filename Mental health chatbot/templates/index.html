<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Mental Health System</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #2c3e50; /* Dark cool background */
            color: #ecf0f1; /* Light text for readability */
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            color: #3498db; /* Cool blue for a calm effect */
            margin-top: 100px;
            font-size: 36px;
        }
        .container {
            text-align: center;
            margin-top: 50px;
        }
        .start-btn {
            padding: 20px 40px;
            font-size: 18px;
            background-color: #34495e; /* Darker button color */
            color: #ecf0f1; /* Text color */
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s, transform 0.3s ease-in-out;
        }
        .start-btn:hover {
            background-color: #2980b9; /* Lighter blue on hover */
            transform: scale(1.1); /* Slightly enlarge the button on hover */
        }
        .container p {
            font-size: 18px;
            color: #bdc3c7; /* Light grey for the text */
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Mental Health System</h1>
    
    <div class="container">
        <p>Let's start by filling out a form with your basic details.</p>
        <a href="{{ url_for('form') }}" class="start-btn">Fill the Form</a>
    </div>
</body>
</html>
